name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: typecheck · build · unit tests · dotnet build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: dotnet build Sona.slnx --configuration Release

  e2e:
    name: e2e (Playwright, Local profile)
    runs-on: ubuntu-latest
    needs: verify
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SonaDev_Local1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'SonaDev_Local1!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: Local
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - name: Write appsettings.Local.json
        run: |
          cat > apps/sona.server/appsettings.Local.json <<'JSON'
          {
            "ConnectionStrings": {
              "DefaultConnection": "Server=localhost,1433;Database=SonaLocal;User Id=sa;Password=SonaDev_Local1!;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"
            },
            "LocalDevAuth": { "Hca34Id": "DEV001", "Name": "Dev Admin", "Email": "dev.admin@example.com" }
          }
          JSON
      - name: Create the schema
        run: |
          dotnet tool restore
          dotnet dotnet-ef database update --project apps/sona.server
      - name: Dev certificate for Kestrel + Vite
        run: dotnet dev-certs https
      - run: pnpm --filter sona.client exec playwright install --with-deps chromium
      - name: Playwright (smoke on PRs, full suite on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter sona.client e2e --grep @smoke
          else
            pnpm --filter sona.client e2e
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/sona.client/playwright-report
            apps/sona.client/test-results
          retention-days: 7
