# Build pipeline: admin (Vite) + API (.NET 10) → one deploy.zip for Azure App Service.
# Deploy (App Service) lives in the release stage; schema migrations are applied from a
# workstation — see docs/deployment.md.

trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  serverProject: 'apps/sona.server/sona.server.csproj'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - task: NodeTool@0
    displayName: 'Install Node.js 22'
    inputs:
      versionSpec: '22.x'

  # pnpm version comes from "packageManager" in package.json.
  - bash: corepack enable && pnpm --version
    displayName: 'Enable pnpm (corepack)'

  - bash: pnpm install --frozen-lockfile
    displayName: 'pnpm install'

  - bash: pnpm typecheck
    displayName: 'Typecheck'

  # Writes the admin bundle to apps/sona.server/wwwroot (git-ignored) — MUST run before
  # dotnet publish, which picks wwwroot up as content.
  - bash: pnpm build
    displayName: 'Build admin (Vite → apps/sona.server/wwwroot)'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish API (+ wwwroot)'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(serverProject)'
      zipAfterPublish: false
      modifyOutputPath: false
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'

  - task: ArchiveFiles@2
    displayName: 'Zip publish output'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/drop/deploy.zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact: drop (deploy.zip)'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
      ArtifactName: 'drop'
